databases:
  - name: secattend-db
    plan: free
    databaseName: secattend
    user: secattend

services:
  - type: web
    name: secattend-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: secattend-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: WEB_ORIGIN
        value: https://secattend-web.onrender.com
      - key: PRODUCTION_RESET_ID
        sync: false
      - key: CONFIRM_PRODUCTION_RESET
        sync: false
      - key: PRODUCTION_ADMIN_EMAIL
        sync: false
      - key: PRODUCTION_ADMIN_PASSWORD
        sync: false
    buildFilter:
      paths:
        - apps/api/**
        - package.json
        - package-lock.json

  - type: web
    name: secattend-web
    runtime: static
    buildCommand: npm ci && npm run build -w @secattend/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://secattend-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
