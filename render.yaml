databases:
  - name: secattend-db
    plan: free
    databaseName: secattend
    user: secattend

services:
  - type: web
    name: secattend-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: secattend-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: ATTENDANCE_EDIT_HOURS
        value: "48"
      - key: WEB_ORIGIN
        value: https://secattend-web.onrender.com

  - type: web
    name: secattend-web
    runtime: static
    buildCommand: npm ci && npm run build -w @secattend/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://secattend-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
